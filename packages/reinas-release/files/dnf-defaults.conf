[main]
best=False
pkg_gpgcheck=True
skip_if_unavailable=True

# ─────────────────────────────────────────────────────────────────────
# 关于更新分层
# ─────────────────────────────────────────────────────────────────────
#
# 这里【刻意不设全局 exclude】。
#
# 曾考虑用 exclude=kernel* glibc* systemd* 来隔离系统通道，但那会让这些包
# 的【安全更新】也一起被静默拦掉 —— 用户以为在打补丁，其实没有。对一个
# 长期在线的 NAS 来说，这是最坏的一种沉默失败。
#
# 正确的做法是通道分离由命令层面实现，见 /usr/bin/reinas-update：
#
#   reinas-update --status     看两个通道各有什么待更新
#   reinas-update --software   只更新 reinas 仓库（面板调用这个）
#   reinas-update --system     显式做全系统更新（管理员手动执行）
#
# dnf 本身保持 Fedora 默认行为，不做任何隐藏修改。
