name: build-image

# 在 GitHub Actions 上构建镜像。
#
# ⚠️ 关键约束：必须用 KVM runner。
# Docker 容器缺 udev，partx --add 之后 /dev/loopNpX 不会被创建，
# kiwi 建分区时必然失败：
#     KiwiMappedDeviceError: Device /dev/loop0p1 does not exist
# 这条已用 Fedora 官方描述零修改复现确认。见 docs/decisions.md D-006。
#
# ubuntu-latest 的 runner 有真 /dev/kvm，标准 docker run 就能拿到完整 /dev。

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "kiwi profile"
        default: "Disk"
        type: string
  push:
    branches: [main]
    paths:
      - "kiwi/**"
      - "packages/**"
      - ".docker/**"
      - ".github/workflows/build-image.yml"

env:
  FEDORA_VER: "45"

jobs:
  build:
    # 必须用支持嵌套虚拟化的 runner；ubuntu-latest 提供 /dev/kvm
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: 检查环境
        run: |
          echo "arch: $(uname -m)"
          echo "docker: $(docker version --format '{{.Server.Version}}')"
          if [ -e /dev/kvm ]; then
            echo "/dev/kvm: 存在"
            ls -la /dev/kvm
          else
            echo "::error::/dev/kvm 不存在，无法构建镜像"
            exit 1
          fi
          df -h /

      - name: 构建镜像
        run: |
          set -o pipefail
          chmod +x .docker/build-in-fedora.sh scripts/*.sh
          docker run --rm --privileged \
            --device /dev/kvm \
            --name reinas-ci-build \
            -v "$PWD":/work \
            -w /work \
            -e PROFILE="${{ inputs.profile || 'Disk' }}" \
            "fedora:${{ env.FEDORA_VER }}" \
            bash -c '
              dnf install -y -q \
                kiwi-cli kiwi-systemdeps distribution-gpg-keys \
                createrepo_c rpm-build
              bash /work/.docker/build-in-fedora.sh
            ' 2>&1 | tee build.log

      - name: 产物清单
        if: always()
        run: |
          echo "=== out/ ==="
          ls -lh out/ 2>/dev/null || echo "(空)"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: 上传 raw 镜像
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: reinas-raw
          path: out/*.raw
          archive: false
          retention-days: 14

      - name: 上传装机 ISO
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: reinas-install-iso
          path: out/*.install.iso
          archive: false
          retention-days: 14
