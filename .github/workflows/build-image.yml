name: build-image

# 在 GitHub Actions 上构建 ReiNAS 镜像。
#
# ⚠️ 为什么必须用 chroot 隔离而不是容器
#
# kiwi 建分区时执行 sgdisk / partx，依赖 /dev/loopNpX 设备节点。
# Docker 容器里没有 udev，内核识别分区后没人创建设备节点：
#     sysfs: loop0p1 存在    /dev: loop0p1 不存在
# 结果必然失败：
#     KiwiMappedDeviceError: Device /dev/loop0p1 does not exist
#
# 这与 KVM 无关。kiwi 维护者 Conan-Kudo 在 mock#1554 里的结论：
#   "every other image type requires using the simple isolation/chroot mode
#    because nspawn breaks Mock's ability to expose loop devices properly"
# 即：普通 chroot（与宿主共享 /dev）可以，容器/nspawn 不行。
#
# 所以这里直接在 runner 上跑，不进容器。

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "kiwi profile"
        default: "Disk"
        type: string
  push:
    branches: [main]
    paths:
      - "kiwi/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/build-image.yml"

env:
  FEDORA_VER: "45"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: 检查宿主环境
        run: |
          echo "arch: $(uname -m)"
          echo "kernel: $(uname -r)"
          echo "=== loop 设备 ==="
          ls /dev/loop* 2>&1 | head -5
          echo "=== udev 状态 ==="
          systemctl is-active systemd-udevd 2>&1 || true
          ls -d /run/udev 2>&1
          echo "=== 验证 loop 分区节点可用 ==="
          sudo dd if=/dev/zero of=/tmp/probe.img bs=1M count=32 status=none
          sudo sfdisk /tmp/probe.img >/dev/null 2>&1 <<'SF'
          label: gpt
          start=2048,size=16384,type=L
          SF
          LOOP=$(sudo losetup -f --show -P /tmp/probe.img)
          echo "loop=$LOOP"
          sudo partx --add "$LOOP" 2>/dev/null || true
          sleep 2
          if sudo test -e "${LOOP}p1"; then
            echo "✓ 分区节点可用: $(sudo ls -la ${LOOP}p1)"
          else
            echo "✗ 分区节点不可用，构建会失败"
          fi
          sudo losetup -d "$LOOP" 2>/dev/null || true
          sudo rm -f /tmp/probe.img

      # runner 是 Ubuntu，需要在 Fedora 环境里跑 kiwi。
      # 用 systemd-nspawn 或 chroot 都不现实（要准备完整 Fedora rootfs），
      # 这里用 chroot 方式：把 Fedora rootfs 解出来，然后 chroot 进去跑，
      # /dev 用 bind mount，与宿主共享——这正是 kiwi 需要的。
      - name: 准备 Fedora chroot
        run: |
          set -e
          # 用 podman 拉镜像只为了取出 rootfs，构建本身不在容器里跑
          sudo mkdir -p /mnt/fedora
          CID=$(sudo podman create "fedora:$FEDORA_VER")
          sudo podman export "$CID" | sudo tar -x -C /mnt/fedora
          sudo podman rm "$CID"

          # /dev 用 bind mount：这是关键。容器里 /dev 是独立挂载的缺 udev 节点，
          # bind 宿主 /dev 后 loopNpX 能正常出现。
          for fs in dev dev/pts proc sys run; do
            sudo mkdir -p "/mnt/fedora/$fs"
            sudo mount --bind "/$fs" "/mnt/fedora/$fs"
          done

          sudo cp /etc/resolv.conf /mnt/fedora/etc/resolv.conf

          # 仓库挂到 /work（脚本里固定用这个路径）
          sudo mkdir -p /mnt/fedora/work
          sudo mount --bind "$PWD" /mnt/fedora/work

          # dracut 需要 /dev/log，否则构建会被判定失败。
          # 具体原因见 scripts/make-dev-log.py。
          sudo python3 scripts/make-dev-log.py /mnt/fedora/dev/log || true

      - name: 构建
        run: |
          set -o pipefail
          sudo chroot /mnt/fedora /bin/bash -c "
            set -e
            dnf install -y -q \
              kiwi-cli kiwi-systemdeps distribution-gpg-keys \
              createrepo_c rpm-build
            echo '=== kiwi ==='
            kiwi-ng --version 2>&1 | tail -1
            echo '=== 验证 chroot 内分区节点 ==='
            dd if=/dev/zero of=/tmp/p.img bs=1M count=32 status=none
            printf 'label: gpt\nstart=2048,size=16384,type=L\n' | sfdisk /tmp/p.img >/dev/null 2>&1
            L=\$(losetup -f --show -P /tmp/p.img)
            sleep 1
            ls -la \${L}p1 && losetup -d \$L && rm -f /tmp/p.img
            echo '=== 开始构建 ==='
            bash /work/.docker/build-in-fedora.sh
          " 2>&1 | tee build.log

      - name: 产物清单
        if: always()
        run: |
          ls -lh out/ 2>/dev/null || echo "(空)"
          sudo umount /mnt/fedora/work 2>/dev/null || true
          for fs in dev/pts dev proc sys run; do
            sudo umount "/mnt/fedora/$fs" 2>/dev/null || true
          done

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: 上传 raw 镜像
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: reinas-raw
          path: out/*.raw
          archive: false
          retention-days: 14

      - name: 上传装机 ISO
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: reinas-install-iso
          path: out/*.install.iso
          archive: false
          retention-days: 14
