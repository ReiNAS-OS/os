name: 构建镜像

# 用 kiwi 官方的 boxbuild 路径构建 ReiNAS 镜像。
# 需要完整 Linux 宿主（KVM + loop + udev），ubuntu-latest 满足。
# 为什么不用容器：见 docs/decisions.md D-006。
#
# 文件名保持英文（build-image.yml），只有显示名是中文。

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "kiwi profile"
        default: "Disk"
        type: string
      debug_password:
        description: "调试账号密码（留空=关闭调试账号，生产形态）"
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "kiwi/**"
      - "packages/**"
      - "scripts/**"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    name: 构建 ReiNAS 镜像
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 检查宿主环境
        run: |
          echo "arch: $(uname -m)"
          echo "kernel: $(uname -r)"
          ls /dev/kvm 2>&1 || echo "无 /dev/kvm"
          ls /dev/loop* 2>&1 | head -3
          systemctl is-active systemd-udevd || true
          df -h /

      # boxbuild 需要 kiwi 和 boxed 插件。Fedora 的包名是
      # kiwi-boxed-plugin（kiwi-boxbuild 那个命令只有 openSUSE 有）。
      - name: 准备 Fedora 环境
        run: |
          set -e
          sudo mkdir -p /mnt/fedora

          # 只借用 podman 取 rootfs，构建本身在 boxbuild 的 VM 里跑
          CID=$(sudo podman create fedora:45)
          sudo podman export "$CID" | sudo tar -x -C /mnt/fedora
          sudo podman rm "$CID"

          # boxbuild 需要：KVM 设备、loop 设备、网络、udev 运行目录
          for p in dev proc sys run; do
            sudo mkdir -p "/mnt/fedora/$p"
            sudo mount --bind "/$p" "/mnt/fedora/$p"
          done
          sudo cp /etc/resolv.conf /mnt/fedora/etc/resolv.conf

          # 仓库挂进 chroot 的 /work（脚本和描述文件都在那里）
          sudo mkdir -p /mnt/fedora/work
          sudo mount --bind "$PWD" /mnt/fedora/work

      - name: 安装构建工具
        run: |
          sudo chroot /mnt/fedora /bin/bash -c '
            dnf install -y -q \
              kiwi-cli kiwi-boxed-plugin kiwi-systemdeps-boxbuild \
              distribution-gpg-keys createrepo_c rpm-build
            echo "kiwi: $(kiwi-ng --version 2>&1 | tail -1)"
            echo "=== 可用 box ==="
            kiwi-ng system boxbuild --list-boxes 2>&1 | grep -E "^\s+name:" | head
          '

      - name: 构建镜像
        env:
          # 留空 = 调试账号关闭（生产形态）。填了才设 reinas 初始密码。
          # 见 docs/decisions.md D-007。
          DEBUG_PASSWORD: ${{ inputs.debug_password || '' }}
          PROFILE: ${{ inputs.profile || 'Disk' }}
        run: |
          set -o pipefail
          if [ -n "$DEBUG_PASSWORD" ]; then
            echo "::warning::本次构建开启了调试账号，产物不可对外发布"
          fi
          # 用 sudo env 把变量塞进 chroot 的环境，而不是拼进 bash -c 的字符串：
          # 密码里带引号、$ 或空格时不会把命令拆坏。
          # chroot 里的 bash -c 用单引号，变量由环境继承。
          # 始终 --lock-out：把这次实际装到的版本导出成 out/*.lock，
          # 作为产物一起分发。想复现时拿它 --lock 即可（D-008）。
          sudo env DEBUG_PASSWORD="$DEBUG_PASSWORD" PROFILE="$PROFILE" \
            chroot /mnt/fedora /bin/bash -c '
              set -e
              cd /work
              bash scripts/build.sh --lock-out
            ' 2>&1 | tee build.log

      - name: 整理产物
        if: always()
        run: |
          # kiwi 从 boxbuild 的 VM 里带回产物时保留了 root 的 0600 权限，
          # upload-artifact 以 runner 用户跑，读不了会报 EACCES。
          sudo chmod -R a+rX out/ 2>/dev/null || true
          ls -lh out/ 2>/dev/null || echo "(空)"
          sudo umount /mnt/fedora/work 2>/dev/null || true
          for m in dev proc sys run; do
            sudo umount -R "/mnt/fedora/$m" 2>/dev/null || true
          done

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: 上传 raw 镜像
        # 用 always()：kiwi 可能已经产出镜像但后续清理步骤非零退出，
        # 此时不应该丢掉产物。if-no-files-found 会显式报错。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reinas-raw
          path: |
            out/*.raw
            out/*.raw.xz
          archive: false
          retention-days: 14

      - name: 上传版本锁文件
        # 版本锁文件跟着镜像一起分发，不入库（D-008）。
        # 拿它配合 `./scripts/build.sh --lock <file>` 可以装回同一批版本。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reinas-lock
          path: out/*.lock
          if-no-files-found: warn
          retention-days: 90

      - name: 上传装机 ISO
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reinas-install-iso
          path: out/*.install.iso
          archive: false
          retention-days: 14
