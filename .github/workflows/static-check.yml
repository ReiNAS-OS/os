name: 校验

# 只做静态检查，不产出镜像。文件名保持英文（validate.yml）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: 静态校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # kiwi 描述里的四类坑都在这一个脚本里查：
      # 注释中的连续减号（XML 规范禁止）、未转义的 &、locale 后缀、
      # 以及包名是否在 Fedora 里真实存在。
      - name: 校验 kiwi 描述
        run: |
          # Fedora 45 的 primary 元数据是 .zst。脚本优先用 python 模块，
          # 没有就退回 zstd 命令行 —— 两条都不通时脚本会明确失败，
          # 不会再「跳过=通过」。ubuntu-latest 自带 zstd，这里只需确认。
          command -v zstd || sudo apt-get install -y -qq zstd
          python3 scripts/check-xml.py --online kiwi/reinas.kiwi

      - name: 禁止编译产物入库
        run: |
          # __pycache__ 和 .pyc 不该进版本库。本地有 pre-commit 钩子拦，
          # 这里兜底防绕过。
          found=$(git ls-files | grep -E '__pycache__|\.pyc$' || true)
          if [ -n "$found" ]; then
            echo "以下编译产物不该入库："
            echo "$found" | sed 's/^/  /'
            exit 1
          fi
          echo "  ✓ 无编译产物"

      - name: 确认调试账号默认关闭
        run: |
          # D-007：调试账号（reinas 初始密码）只能由显式开关打开。
          # 这里守住三件事，防止它被改成「一直是开的」。
          fail=0

          # 1. 描述文件里必须带 debug.conf，否则开关就断了
          if ! grep -q 'name="debug.conf"' kiwi/reinas.kiwi; then
            echo "  ✗ reinas.kiwi 里缺少 debug.conf 的 <file> 条目，调试开关已失效"
            fail=1
          fi

          # 2. build.sh 里相对这个变量的判断必须是「非空才开」
          if ! grep -q 'if \[ -n "\$DEBUG_PASSWORD" \]' scripts/build.sh; then
            echo "  ✗ build.sh 里没有 'if [ -n \"\$DEBUG_PASSWORD\" ]' 这个守卫"
            fail=1
          fi

          # 3. config.sh 必须同时存在「有密码 → 开」和「无密码 → 清掉配置」两条路
          if ! grep -q 'rm -f /etc/reinas/debug.conf' kiwi/config.sh; then
            echo "  ✗ config.sh 没有清掉 debug.conf 的分支，明文密码会留在镜像里"
            fail=1
          fi

          # 4. 调试密码文件本身不入库
          if git ls-files --error-unmatch kiwi/debug.conf >/dev/null 2>&1; then
            echo "  ✗ kiwi/debug.conf 被提交进版本库了"
            fail=1
          fi

          if [ "$fail" != 0 ]; then exit 1; fi
          echo "  ✓ 调试账号默认关闭，开关链路完整"

      - name: 检查调试开关的实际行为
        run: |
          # 真跑一遍 build.sh 的开关逻辑，两种状态都验。
          tmp=$(mktemp -d)
          cd "$tmp"
          # 只截取 write_debug_conf 的逻辑，不启动构建
          cat > probe.sh <<'EOF'
          set -euo pipefail
          die() { echo "$*" >&2; exit 1; }
          write_debug_conf() {
              local conf="$1/debug.conf"
              if [ -n "$DEBUG_PASSWORD" ]; then
                  case "$DEBUG_PASSWORD" in
                      *$'\n'*) die "调试密码不能含换行" ;;
                  esac
                  printf '%s\n' "$DEBUG_PASSWORD" > "$conf"
              else
                  : > "$conf"
              fi
          }
          EOF
          source probe.sh

          # 关闭态：空文件
          DEBUG_PASSWORD=""
          write_debug_conf "$tmp"
          test ! -s "$tmp/debug.conf" || { echo "  ✗ 关闭态应生成空文件"; exit 1; }
          echo "  ✓ 关闭态：debug.conf 为空"

          # 开启态：正好是密码 + 换行
          DEBUG_PASSWORD=123456
          write_debug_conf "$tmp"
          test "$(cat "$tmp/debug.conf")" = "123456" \
            || { echo "  ✗ 开启态写出的密码不对"; exit 1; }
          echo "  ✓ 开启态：debug.conf 内容正确"

          # 元字符不被展开
          DEBUG_PASSWORD='a$b`c"d'
          write_debug_conf "$tmp"
          REINAS_DEBUG_PASSWORD=""
          IFS= read -r REINAS_DEBUG_PASSWORD < "$tmp/debug.conf"
          test "$REINAS_DEBUG_PASSWORD" = 'a$b`c"d' \
            || { echo "  ✗ 元字符密码读取不一致"; exit 1; }
          echo "  ✓ 元字符密码不被 shell 展开"

          # 换行被拒
          if ( DEBUG_PASSWORD=$'x\ny'; write_debug_conf "$tmp" ) 2>/dev/null; then
            echo "  ✗ 含换行的密码应被拒绝"
            exit 1
          fi
          echo "  ✓ 含换行的密码被拒绝"

      - name: 检查版本锁定链路完整
        run: |
          # D-008：默认跟最新，--lock-out 导出锁文件、--lock 用锁文件复现。
          # 这里守住几个容易改坏的点。
          fail=0

          # 1. check-xml.py 必须能吐显式包列表（gen_lock 依赖它）
          n=$(python3 scripts/check-xml.py --list-explicit kiwi/reinas.kiwi | wc -l | tr -d " ")
          if [ "$n" -lt 50 ]; then
            echo "  ✗ --list-explicit 只返回 $n 个包，gen_lock 会生成残缺锁文件"
            fail=1
          else
            echo "  ✓ --list-explicit 返回 $n 个显式包"
          fi

          # 2. 锁定构建必须显式 --kiwi-file。
          #    kiwi 对 *.kiwi 做 glob 后 sorted 取第一个，
          #    reinas.locked.kiwi 排在 reinas.kiwi 前面，不指定就用错文件。
          if ! grep -q 'kiwi-file' scripts/build.sh; then
            echo "  ✗ build.sh 没有 --kiwi-file，锁定构建会静默用错描述文件"
            fail=1
          else
            echo "  ✓ --lock 时显式传 --kiwi-file"
          fi

          # 3. 派生描述不能入库
          if ! grep -q 'reinas.locked.kiwi' .gitignore; then
            echo "  ✗ reinas.locked.kiwi 没进 .gitignore"
            fail=1
          else
            echo "  ✓ 派生描述已忽略"
          fi

          # 4. 锁文件本身也不入库
          if git ls-files --error-unmatch 'kiwi/*.lock' >/dev/null 2>&1; then
            echo "  ✗ 锁文件被提交进版本库了（D-008 要求只作为产物分发）"
            fail=1
          else
            echo "  ✓ 锁文件不入库"
          fi

          if [ "$fail" != 0 ]; then exit 1; fi

      - name: 检查 workflow 结构
        run: |
          # 三个 workflow 分工明确，构建逻辑只有一份。
          fail=0

          # 1. composite action 必须存在且被两个构建 workflow 引用
          if [ ! -f .github/actions/build-image/action.yml ]; then
            echo "  ✗ 缺少 .github/actions/build-image/action.yml"
            fail=1
          fi
          for wf in image-build image-rebuild; do
            if ! grep -q '.github/actions/build-image' ".github/workflows/$wf.yml"; then
              echo "  ✗ $wf.yml 没有引用 composite action，构建逻辑会重复"
              fail=1
            fi
          done

          # 2. 构建逻辑不该再散落在 workflow 里
          #    （chroot / podman export 这类只该出现在 action 里）
          #    （只查两个构建 workflow —— 本文件里出现这个字符串是检查逻辑本身）
          for wf in image-build image-rebuild; do
            f=".github/workflows/$wf.yml"
            [ -f "$f" ] || continue
            if grep -q 'podman export' "$f"; then
              echo "  ✗ $wf.yml 里直接写了 podman export，应移进 composite action"
              fail=1
            fi
          done

          # 3. workflow 文件名必须是动词在前的英文（不含下划线/空格）
          for f in .github/workflows/*.yml; do
            base=$(basename "$f" .yml)
            case "$base" in
              *[A-Z_]*|*' '*)
                echo "  ✗ $f 文件名应为小写英文连字符（如 image-build）"
                fail=1 ;;
            esac
          done

          if [ "$fail" != 0 ]; then exit 1; fi
          echo "  ✓ 结构正确：3 个 workflow，构建逻辑只有一份"

      - name: 校验 reinas-release.spec 注释里没有百分号
        run: |
          # RPM 会把注释里的 % 当宏展开，导致 "Macro XXX has empty body"。
          python3 - <<'PY'
          import sys
          bad = [
              (i, l) for i, l in enumerate(
                  open('packages/reinas-release/reinas-release.spec').read().split('\n'), 1
              )
              if l.strip().startswith('#') and '%' in l
          ]
          if bad:
              for i, l in bad:
                  print(f"  ✗ line {i}: {l.strip()[:80]}")
              print("spec 注释里不能出现百分号")
              sys.exit(1)
          print("  ✓ 通过")
          PY

      - name: 校验 reinas-update 可执行
        run: |
          python3 -m py_compile packages/reinas-release/files/reinas-update
          echo "  ✓ 语法通过"

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh kiwi/config.sh

      - name: bash 语法
        run: |
          for f in scripts/*.sh kiwi/config.sh; do
            bash -n "$f" && echo "  ✓ $f"
          done

