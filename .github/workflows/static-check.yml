name: 校验

# 只做静态检查，不产出镜像。文件名保持英文（validate.yml）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: 静态校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # kiwi 描述里的四类坑都在这一个脚本里查：
      # 注释中的连续减号（XML 规范禁止）、未转义的 &、locale 后缀、
      # 以及包名是否在 Fedora 里真实存在。
      - name: 校验 kiwi 描述
        run: |
          # Fedora 45 的 primary 元数据是 .zst。脚本优先用 python 模块，
          # 没有就退回 zstd 命令行 —— 两条都不通时脚本会明确失败，
          # 不会再「跳过=通过」。ubuntu-latest 自带 zstd，这里只需确认。
          command -v zstd || sudo apt-get install -y -qq zstd
          python3 scripts/check-xml.py --online kiwi/reinas.kiwi

      - name: 禁止编译产物入库
        run: |
          # __pycache__ 和 .pyc 不该进版本库。本地有 pre-commit 钩子拦，
          # 这里兜底防绕过。
          found=$(git ls-files | grep -E '__pycache__|\.pyc$' || true)
          if [ -n "$found" ]; then
            echo "以下编译产物不该入库："
            echo "$found" | sed 's/^/  /'
            exit 1
          fi
          echo "  ✓ 无编译产物"

      - name: 确认 root 密码默认关闭
        run: |
          # D-007：root 密码只能由显式开关打开，默认必须锁定。
          # 这里守住四件事，防止它被改成「一直是开的」。
          fail=0

          # 1. 描述文件里必须带 root.conf，否则开关就断了
          if ! grep -q 'name="root.conf"' kiwi/reinas.kiwi; then
            echo "  ✗ reinas.kiwi 里缺少 root.conf 的 <file> 条目，开关已失效"
            fail=1
          fi

          # 2. build.sh 里的守卫必须是「非空才开」
          if ! grep -q 'if \[ -n "\$ROOT_PASSWORD" \]' scripts/build.sh; then
            echo "  ✗ build.sh 里没有 'if [ -n \"\$ROOT_PASSWORD\" ]' 这个守卫"
            fail=1
          fi

          # 3. config.sh 必须两个分支都清掉 root.conf，明文密码不能留镜像里
          if ! grep -q 'rm -f /etc/reinas/root.conf' kiwi/config.sh; then
            echo "  ✗ config.sh 没有清掉 root.conf，明文密码会留在镜像里"
            fail=1
          fi

          # 4. 生产分支必须锁定 root
          if ! grep -q 'passwd -l root' kiwi/config.sh; then
            echo "  ✗ config.sh 没有 passwd -l root，生产形态下 root 没被锁定"
            fail=1
          fi

          # 5. 密码文件本身不入库
          if git ls-files --error-unmatch kiwi/root.conf >/dev/null 2>&1; then
            echo "  ✗ kiwi/root.conf 被提交进版本库了"
            fail=1
          fi

          if [ "$fail" != 0 ]; then exit 1; fi
          echo "  ✓ root 密码默认关闭，开关链路完整"

      - name: 检查 root 密码开关的实际行为
        run: |
          # 真跑一遍 build.sh 的开关逻辑，两种状态都验。
          tmp=$(mktemp -d)
          cd "$tmp"
          # 只截取 write_root_conf 的逻辑，不启动构建
          cat > probe.sh <<'PROBE'
          set -euo pipefail
          die() { echo "$*" >&2; exit 1; }
          write_root_conf() {
              local conf="$1/root.conf"
              if [ -n "$ROOT_PASSWORD" ]; then
                  case "$ROOT_PASSWORD" in
                      *$'\n'*) die "root 密码不能含换行" ;;
                  esac
                  printf '%s\n' "$ROOT_PASSWORD" > "$conf"
              else
                  : > "$conf"
              fi
          }
          PROBE
          . probe.sh

          # 关闭态：空文件
          ROOT_PASSWORD=""
          write_root_conf "$tmp"
          test ! -s "$tmp/root.conf" || { echo "  ✗ 关闭态应生成空文件"; exit 1; }
          echo "  ✓ 关闭态：root.conf 为空"

          # 开启态：正好是密码 + 换行
          ROOT_PASSWORD=123456
          write_root_conf "$tmp"
          test "$(cat "$tmp/root.conf")" = "123456" \
            || { echo "  ✗ 开启态写出的密码不对"; exit 1; }
          echo "  ✓ 开启态：root.conf 内容正确"

          # 元字符不被展开
          ROOT_PASSWORD='a$b`c"d'
          write_root_conf "$tmp"
          REINAS_ROOT_PASSWORD=""
          IFS= read -r REINAS_ROOT_PASSWORD < "$tmp/root.conf"
          test "$REINAS_ROOT_PASSWORD" = 'a$b`c"d' \
            || { echo "  ✗ 元字符密码读取不一致"; exit 1; }
          echo "  ✓ 元字符密码不被 shell 展开"

          # 换行被拒
          if ( ROOT_PASSWORD=$'x\ny'; write_root_conf "$tmp" ) 2>/dev/null; then
            echo "  ✗ 含换行的密码应被拒绝"
            exit 1
          fi
          echo "  ✓ 含换行的密码被拒绝"

      - name: 检查版本锁定链路完整
        run: |
          # D-008：默认跟最新，--lock-out 导出锁文件、--lock 用锁文件复现。
          # 这里守住几个容易改坏的点。
          fail=0

          # 1. check-xml.py 必须能吐显式包列表（gen_lock 依赖它）
          n=$(python3 scripts/check-xml.py --list-explicit kiwi/reinas.kiwi | wc -l | tr -d " ")
          if [ "$n" -lt 50 ]; then
            echo "  ✗ --list-explicit 只返回 $n 个包，gen_lock 会生成残缺锁文件"
            fail=1
          else
            echo "  ✓ --list-explicit 返回 $n 个显式包"
          fi

          # 2. 锁定构建必须显式 --kiwi-file。
          #    kiwi 对 *.kiwi 做 glob 后 sorted 取第一个，
          #    reinas.locked.kiwi 排在 reinas.kiwi 前面，不指定就用错文件。
          if ! grep -q 'kiwi-file' scripts/build.sh; then
            echo "  ✗ build.sh 没有 --kiwi-file，锁定构建会静默用错描述文件"
            fail=1
          else
            echo "  ✓ --lock 时显式传 --kiwi-file"
          fi

          # 3. 派生描述不能入库
          if ! grep -q 'reinas.locked.kiwi' .gitignore; then
            echo "  ✗ reinas.locked.kiwi 没进 .gitignore"
            fail=1
          else
            echo "  ✓ 派生描述已忽略"
          fi

          # 4. 锁文件本身也不入库
          if git ls-files --error-unmatch 'kiwi/*.lock' >/dev/null 2>&1; then
            echo "  ✗ 锁文件被提交进版本库了（D-008 要求只作为产物分发）"
            fail=1
          else
            echo "  ✓ 锁文件不入库"
          fi

          if [ "$fail" != 0 ]; then exit 1; fi

      - name: 检查 workflow 结构
        run: |
          # 三个 workflow 分工明确，构建逻辑只有一份。
          fail=0

          # 1. composite action 必须存在且被两个构建 workflow 引用
          if [ ! -f .github/actions/build-image/action.yml ]; then
            echo "  ✗ 缺少 .github/actions/build-image/action.yml"
            fail=1
          fi
          for wf in image-build image-rebuild; do
            if ! grep -q '.github/actions/build-image' ".github/workflows/$wf.yml"; then
              echo "  ✗ $wf.yml 没有引用 composite action，构建逻辑会重复"
              fail=1
            fi
          done

          # 2. 构建逻辑不该再散落在 workflow 里
          #    （chroot / podman export 这类只该出现在 action 里）
          #    （只查两个构建 workflow —— 本文件里出现这个字符串是检查逻辑本身）
          for wf in image-build image-rebuild; do
            f=".github/workflows/$wf.yml"
            [ -f "$f" ] || continue
            if grep -q 'podman export' "$f"; then
              echo "  ✗ $wf.yml 里直接写了 podman export，应移进 composite action"
              fail=1
            fi
          done

          # 3. composite action 的元数据字段里不能有表达式。
          #    GitHub 加载 action.yml 时先校验 name/description/inputs，
          #    这几个字段不支持表达式求值，写了会报 Unrecognized named-value
          #    并拒绝加载整个 action，构建直接失败（踩过一次）。
          #
          #    ⚠️ 这里不能把表达式字面量写进 grep —— GitHub 会扫描 run: 里的
          #    整个脚本文本，字面量会被当成真的表达式，模板解析失败、
          #    整个 workflow 加载不起来（踩过第二次）。用 $ 加拼接绕开。
          expr_open='$''{'
          for act in .github/actions/*/action.yml; do
            [ -f "$act" ] || continue
            meta=$(awk '/^runs:/{exit} {print}' "$act")
            if printf '%s' "$meta" | grep -qF "$expr_open"; then
              echo "  ✗ $act 的元数据字段里有表达式，GitHub 会拒绝加载"
              printf '%s\n' "$meta" | grep -nF "$expr_open" | head -3 | sed 's/^/      /'
              fail=1
            fi
          done

          # 4. workflow 文件名必须是动词在前的英文（不含下划线/空格）
          for f in .github/workflows/*.yml; do
            base=$(basename "$f" .yml)
            case "$base" in
              *[A-Z_]*|*' '*)
                echo "  ✗ $f 文件名应为小写英文连字符（如 image-build）"
                fail=1 ;;
            esac
          done

          if [ "$fail" != 0 ]; then exit 1; fi
          echo "  ✓ 结构正确：3 个 workflow，构建逻辑只有一份"

      - name: 检查登录提示只用物理屏安全字符
        run: |
          # 登录提示要能在物理 VGA/VBE 控制台显示，所以：
          #   - 只能 ASCII（CJK 在 VGA 字体里缺字形，会显示成空白/问号）
          #   - 只能 ANSI 16 色 SGR（256 色/真彩色物理屏不支持）
          #
          # 用 python 而不是 grep/sed：BSD 与 GNU 工具对「非 ASCII / 非 printable」
          # 的处理不一致（macOS 的 grep 没有 -P，sed 在 UTF-8 locale 下会把中文
          # 当 printable 删掉），跨平台只有直接看字节可靠。
          python3 - <<'PYEOF'
          import re
          import sys

          src = open('kiwi/config.sh', encoding='utf-8').read()
          m = re.search(
              r"cat > /usr/lib/reinas/reinas-issue-update <<'ISSUEEOF'\n(.*?)\nISSUEEOF",
              src, re.S,
          )
          if not m:
              sys.exit('  ✗ 找不到 reinas-issue-update 脚本')
          body = m.group(1)

          fail = 0
          # 逐行检查，跳过注释行
          for i, line in enumerate(body.split('\n'), 1):
              if line.lstrip().startswith('#'):
                  continue
              for ch in line:
                  if ord(ch) > 0x7F:
                      print(f'  ✗ 第 {i} 行含非 ASCII 字符 {ch!r}'
                            f'（物理控制台无法显示）')
                      fail = 1
                      break

          # 256 色（38;5;n / 48;5;n）与真彩色（38;2;r;g;b）
          if re.search(r'\\033\[(38|48);[25];', body):
              print('  ✗ 用了 256 色或真彩色，物理控制台只支持 16 色')
              fail = 1

          if fail:
              sys.exit(1)
          print('  ✓ 登录提示只用 ASCII + ANSI 16 色')
          PYEOF

      - name: 校验 reinas-release.spec 注释里没有百分号
        run: |
          # RPM 会把注释里的 % 当宏展开，导致 "Macro XXX has empty body"。
          python3 - <<'PY'
          import sys
          bad = [
              (i, l) for i, l in enumerate(
                  open('packages/reinas-release/reinas-release.spec').read().split('\n'), 1
              )
              if l.strip().startswith('#') and '%' in l
          ]
          if bad:
              for i, l in bad:
                  print(f"  ✗ line {i}: {l.strip()[:80]}")
              print("spec 注释里不能出现百分号")
              sys.exit(1)
          print("  ✓ 通过")
          PY

      - name: 校验 reinas-update 可执行
        run: |
          python3 -m py_compile packages/reinas-release/files/reinas-update
          echo "  ✓ 语法通过"

      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/*.sh kiwi/config.sh

      - name: bash 语法
        run: |
          for f in scripts/*.sh kiwi/config.sh; do
            bash -n "$f" && echo "  ✓ $f"
          done

