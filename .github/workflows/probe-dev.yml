name: probe-dev

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 宿主 /dev 与 udev
        run: |
          echo "=== 宿主 loop 设备 ==="
          ls /dev/loop* 2>&1 | head -5
          echo "=== 宿主 udev ==="
          ls -d /run/udev 2>&1
          systemctl is-active systemd-udevd 2>&1

      - name: 容器内 /dev 与 udev
        run: |
          docker run --rm --privileged fedora:45 bash -c '
            echo "--- 容器 /dev/loop ---"
            ls /dev/loop* 2>&1 | head -5
            echo "--- 容器 /run/udev ---"
            ls -d /run/udev 2>&1
            echo "--- 容器 udevd 进程数 ---"
            pgrep -c udevd 2>/dev/null || echo 0
            echo "--- 装工具并测试分区 ---"
            dnf install -y -q util-linux >/dev/null 2>&1
            dd if=/dev/zero of=/tmp/t bs=1M count=32 status=none
            printf "label: gpt\nstart=2048,size=16384,type=L\n" | sfdisk /tmp/t >/dev/null 2>&1
            L=$(losetup -f --show -P /tmp/t)
            echo "loop=$L"
            sleep 2
            echo "--- /dev 分区节点 ---"
            ls -la ${L}p1 2>&1
            echo "--- sysfs 分区条目 ---"
            ls /sys/block/$(basename $L)/ 2>/dev/null | grep p1 || echo "无"
          '
