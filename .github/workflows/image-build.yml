name: 构建镜像

# 用 kiwi 官方的 boxbuild 路径构建 ReiNAS 镜像。
# 构建步骤抽在 .github/actions/build-image 里，「锁定重建」workflow 复用同一份。
# 需要完整 Linux 宿主（KVM + loop + udev）。为什么不用容器：见 D-006。
#
# 文件名保持英文（image-build.yml），显示名是中文。

# 只在手动触发时构建。
#
# 不挂 push：构建要跑 15 分钟且吃满 runner，push 触发等于每次改文档都白跑
# 一轮；而且默认产出的是「无口令、进不去」的生产形态镜像，自动构建没有
# 实际用途。需要镜像时手动点。
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "kiwi profile"
        default: "Disk"
        type: string
      root_password:
        description: "root 密码（留空=锁定 root，生产形态）"
        default: ""
        type: string
      arch:
        description: "目标架构。aarch64 用 arm64 runner，构建更快"
        type: choice
        default: x86_64
        options:
          - x86_64
          - aarch64

jobs:
  build:
    name: 构建 ReiNAS 镜像（${{ inputs.arch || 'x86_64' }}）
    # aarch64 用 GitHub 的 arm64 runner。公开仓库免费且不限量。
    # 产物在目标架构上原生构建，不需要交叉编译。
    #
    # ⚠️ arm64 没有 ubuntu-latest-arm 这个标签，必须写具体版本。
    #    x64 的 ubuntu-latest 已于 2026-11 迁到 26.04，两边对齐成 26.04。
    #    升级 runner 镜像时两处一起改（见 README 的「升级到下一个 Fedora」）。
    runs-on: ${{ (inputs.arch == 'aarch64') && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 构建
        uses: ./.github/actions/build-image
        with:
          profile: ${{ inputs.profile || 'Disk' }}
          root-password: ${{ inputs.root_password || '' }}
          arch: ${{ inputs.arch || 'x86_64' }}
          # 始终导出锁文件：把这次实际装到的版本记下来，作为产物一起分发。
          # 想复现时用「锁定重建」workflow 拿它重建（D-008）。
          lock-out: "1"

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ inputs.arch || 'x86_64' }}
          path: build.log
          retention-days: 14

      - name: 上传 raw 镜像
        # 用 always()：kiwi 可能已经产出镜像但后续清理步骤非零退出，
        # 此时不应该丢掉产物。if-no-files-found 会显式报错。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reinas-raw-${{ inputs.arch || 'x86_64' }}
          path: |
            out/*.raw
            out/*.raw.xz
          archive: false
          retention-days: 14

      - name: 上传版本锁文件
        # 锁文件跟着镜像一起分发，不入库（D-008）。
        # 拿它配合「锁定重建」workflow 可以装回同一批版本。
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reinas-lock-${{ inputs.arch || 'x86_64' }}
          path: out/*.lock
          if-no-files-found: warn
          retention-days: 90

      - name: 上传装机 ISO
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reinas-install-iso-${{ inputs.arch || 'x86_64' }}
          path: out/*.install.iso
          archive: false
          retention-days: 14
