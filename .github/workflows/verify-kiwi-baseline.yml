name: verify-kiwi-baseline

# 对照组实验：用 Fedora 官方 kiwi 描述，不改任何东西，验证 kiwi 能否出镜像。
#
# 目的：回答一个问题——之前构建失败，是 kiwi 本身在 Fedora 45 上跑不通，
# 还是我们自己改坏了（改了 bootstrap 顺序、打了 5 处源码补丁、
# 去掉 --config、强制 use_default_location 等）。
#
# 如果这个 workflow 成功，说明 kiwi 是好的，问题在我们的描述文件或构建方式。
# 如果它也失败，说明 kiwi 11.1.x 确实与 Fedora 45 不兼容，需要换路子。
#
# 这个 workflow 不产出 ReiNAS 镜像，只验证基线。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-kiwi-baseline.yml"

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 环境信息
        run: |
          echo "runner: $(uname -m) / $(lsb_release -ds 2>/dev/null || cat /etc/os-release | head -1)"
          echo "docker: $(docker version --format '{{.Server.Version}}')"
          echo "KVM: $(ls -la /dev/kvm 2>&1 | head -1)"
          df -h /

      # 关键：KVM 可用时优先走 kiwi 官方的 boxbuild 路径，
      # 那条路不需要我们改 kiwi 源码，loop 设备由 box 内部处理。
      - name: 获取 Fedora 官方 kiwi 描述
        run: |
          git clone --depth 1 -b f45 \
            https://forge.fedoraproject.org/releng/kiwi-descriptions.git
          echo "=== VARIANTS ==="
          head -20 kiwi-descriptions/VARIANTS.md
          echo "=== 结构 ==="
          ls kiwi-descriptions/

      - name: 用官方描述构建 Cloud-Base-Generic
        run: |
          set -o pipefail
          docker run --rm \
            --privileged \
            --name kiwi-baseline \
            -v "$PWD/kiwi-descriptions:/work" \
            -w /work \
            fedora:45 \
            bash -c '
              set -e
              echo "=== 安装 kiwi（不加任何补丁） ==="
              dnf install -y -q \
                kiwi-cli kiwi-systemdeps distribution-gpg-keys \
                createrepo_c
              echo "kiwi: $(kiwi-ng --version 2>&1 | tail -1)"

              echo "=== loop 设备检查 ==="
              ls -la /dev/loop* 2>&1 | head -3
              losetup -f || true

              echo "=== 构建（官方描述，零修改） ==="
              # 构建目录放在容器内部，避开 macOS 共享挂载的 xattr 限制。
              # GitHub runner 是 Linux，这里写 /var/tmp 同样安全。
              rm -rf /var/tmp/base-out && mkdir -p /var/tmp/base-out
              kiwi-ng --debug \
                --type oem \
                --profile Cloud-Base-Generic \
                --logfile /var/tmp/base-out/kiwi.log \
                system build \
                --description /work \
                --target-dir /var/tmp/base-out

              echo "=== 产物 ==="
              ls -lh /var/tmp/base-out/
            ' 2>&1 | tee baseline.log

      - name: 产物检查
        if: always()
        run: |
          echo "=== 日志尾部 ==="
          tail -40 baseline.log 2>/dev/null || true
          echo
          echo "=== 结论 ==="
          if grep -q "Kiwi.*Error\|Kiwi.*Failed\|##\[error\]" baseline.log 2>/dev/null; then
            grep -E "Kiwi[A-Za-z]*Error|Kiwi[A-Za-z]*Failed" baseline.log | head -3
          else
            echo "  无 kiwi 错误"
          fi

      - name: 上传日志
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-log
          path: baseline.log
          retention-days: 7
